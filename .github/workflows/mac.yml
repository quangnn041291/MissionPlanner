name: OSX Build
on: [push, workflow_dispatch, pull_request]

permissions:
  contents: write

jobs:
  buildOSX:
    name: Build OSX
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 10

      - name: Cache multiple paths
        uses: actions/cache@v4
        with:
          path: |
            **/obj/**
          key: ${{ runner.os }}-buildOSX

      # The xamarin-* and mono-mdk-for-visual-studio Homebrew casks were
      # deleted in August/September 2026 (Xamarin is discontinued), so
      # install the same Microsoft/Mono packages the casks wrapped.
      - name: Install Mono MDK and Xamarin.Mac
        shell: bash
        run: |
          set -e
          install_pkg() {
            url="$1"; sha="$2"; pkg="$(basename "$url")"
            curl -fsSL -o "$pkg" "$url"
            echo "$sha  $pkg" | shasum -a 256 -c -
            sudo installer -pkg "$pkg" -target /
            rm -f "$pkg"
          }
          install_pkg https://download.mono-project.com/archive/6.12.0/macos-10-universal/MonoFramework-MDK-6.12.0.206.macos10.xamarin.universal.pkg 80b0dbfa59ba9ed76dbf1393998e6a2ed2d1ccc8f5850c7a46fbe31a2aea88d8
          install_pkg https://download.visualstudio.microsoft.com/download/pr/ceb0ea3f-4db8-46b4-8dc3-8049d27c0107/7b04843d469aae253519989fcb8e750f/xamarin.mac-9.3.0.23.pkg 9aa89a4d273e5fc246f779db5d23907c414b98b76fe51e30cb60e8ccd1199956
      # Fixes for the ExtLibs/mono submodule (meee1/mono), kept as patches in this repo.
      - name: Patch the mono submodule
        shell: bash
        run: |
          set -e
          for p in ExtLibs/Xamarin/patches/mono-*.patch; do
            echo "applying $p"
            git -C ExtLibs/mono apply --verbose "$PWD/$p"
          done

      - name: Build
        shell: pwsh
        run: |
          msbuild -ver
          dotnet --version
          dotnet --list-sdks
          msbuild -v:m -restore  -p:Configuration=Release "ExtLibs\Xamarin\Xamarin.MacOS\Xamarin.MacOS.csproj"

      # Xamarin.Mac bundles an x86_64 only libmono-native.dylib even in a universal app.
      # Add an arm64 slice from the Xamarin.Mac or Mono SDK, which ship the same Mono version.
      - name: Make libmono-native universal
        shell: bash
        run: |
          set -e
          bundle="ExtLibs/Xamarin/Xamarin.MacOS/bin/Release/Mission Planner.app/Contents/MonoBundle"
          app_lib="$bundle/libmono-native.dylib"
          echo "app: $(lipo -archs "$app_lib")"
          src=""
          while IFS= read -r f; do
            archs=$(lipo -archs "$f" 2>/dev/null || true)
            echo "candidate: $archs $f"
            if [ -z "$src" ] && echo "$archs" | grep -qw arm64; then src="$f"; fi
          done < <(find -L /Library/Frameworks/Xamarin.Mac.framework/Versions/Current/ /Library/Frameworks/Mono.framework/Versions/Current/ -name 'libmono-native*.dylib' 2>/dev/null | sort -r)
          if ! lipo "$app_lib" -verify_arch arm64 && [ -n "$src" ]; then
            echo "using arm64 slice from $src"
            lipo "$src" -thin arm64 -output arm64.dylib
            lipo "$app_lib" arm64.dylib -create -output "$app_lib"
            rm -f arm64.dylib
          fi
          for f in "$bundle"/*.dylib "$bundle/../MacOS/Mission Planner"; do echo "$(lipo -archs "$f") $(basename "$f")"; done

      # Apple Silicon refuses to load arm64 code without a valid signature, and mmp edits
      # libSkiaSharp.dylib after it was signed. Ad-hoc sign the libraries, then the app.
      - name: Ad-hoc sign the app
        shell: bash
        run: |
          set -e
          app="ExtLibs/Xamarin/Xamarin.MacOS/bin/Release/Mission Planner.app"
          codesign --force --sign - "$app"/Contents/MonoBundle/*.dylib
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          for f in "$app"/Contents/MonoBundle/*.dylib; do codesign --verify --arch arm64 "$f"; done

      - name: Package
        shell: pwsh
        continue-on-error: true
        run: |
          npm install --global create-dmg
          cd ExtLibs/Xamarin/Xamarin.MacOS/bin/Release/
          create-dmg 'Mission Planner.app' --dmg-title='Mission Planner'
          
      - uses: actions/upload-artifact@v4
        with:
          name: osx
          path: |
            ExtLibs/Xamarin/Xamarin.MacOS/bin/Release/*.dmg

      - uses: "marvinpinto/action-automatic-releases@v1.2.1"
        if: ${{ github.event_name == 'push' }}
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "osxlatest"
          prerelease: true
          title: "OSX Development Build"
          files: '**/*.dmg'
